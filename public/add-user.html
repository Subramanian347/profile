<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProfilePilot Pro | Manage Users</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .profile-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
    }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Navbar -->
  <nav class="gradient-bg text-white shadow-lg">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <i data-feather="user" class="w-6 h-6"></i>
        <span class="text-xl font-bold">ProfilePilot Pro</span>
      </div>
      <div class="flex space-x-4">
        <a href="index.html" class="bg-white text-indigo-700 px-4 py-2 rounded-md hover:bg-gray-100">Dashboard</a>
        <button id="toggleAddUserBtn" class="bg-white text-indigo-700 px-4 py-2 rounded-md hover:bg-gray-100">Add New User</button>
      </div>
    </div>
  </nav>

  <main class="container mx-auto px-4 py-8 max-w-7xl">
    <div class="flex flex-col md:flex-row md:space-x-10">

      <!-- User List -->
      <section class="flex-1 mb-10 md:mb-0">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">User Profiles</h1>
        <div id="user-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Injected via JS -->
        </div>
      </section>

      <!-- Add User Form -->
      <section id="addUserSection" class="hidden flex-1 bg-white rounded-xl shadow-md">
        <div class="gradient-bg p-6 text-white rounded-t-xl">
          <h2 class="text-xl font-bold">Add New User</h2>
          <p class="text-indigo-100 text-sm">Fill in the details to create a new user profile.</p>
        </div>
        <form id="userForm" class="p-6 space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-gray-700 mb-2">First Name</label>
              <input type="text" id="firstName" class="w-full border rounded-lg px-4 py-2" required />
            </div>
            <div>
              <label class="block text-gray-700 mb-2">Last Name</label>
              <input type="text" id="lastName" class="w-full border rounded-lg px-4 py-2" required />
            </div>
            <div>
              <label class="block text-gray-700 mb-2">Email</label>
              <input type="email" id="email" class="w-full border rounded-lg px-4 py-2" required />
            </div>
            <div>
              <label class="block text-gray-700 mb-2">Phone</label>
              <input type="tel" id="phone" class="w-full border rounded-lg px-4 py-2" />
            </div>
            <div>
              <label class="block text-gray-700 mb-2">Role</label>
              <select id="role" class="w-full border rounded-lg px-4 py-2">
                <option>Administrator</option>
                <option>Content Editor</option>
                <option>Regular User</option>
              </select>
            </div>
            <div>
              <label class="block text-gray-700 mb-2">City</label>
              <input type="text" id="city" class="w-full border rounded-lg px-4 py-2" />
            </div>
            <div>
              <label class="block text-gray-700 mb-2">State</label>
              <input type="text" id="state" class="w-full border rounded-lg px-4 py-2" />
            </div>
            <div>
              <label class="block text-gray-700 mb-2">Avatar</label>
              <div class="flex items-center space-x-4">
                <div class="w-16 h-16 bg-gray-200 rounded-full overflow-hidden">
                  <img id="avatarPreview" src="https://via.placeholder.com/100" class="w-full h-full object-cover" />
                </div>
                <input type="file" id="avatar" class="hidden" accept="image/*" />
                <button type="button" onclick="document.getElementById('avatar').click()" class="text-indigo-600 hover:underline flex items-center">
                  <i data-feather="upload" class="w-4 h-4 mr-1"></i> Upload
                </button>
              </div>
            </div>
          </div>

          <div class="flex justify-end space-x-4">
            <button type="button" id="cancelAddUser" class="px-6 py-2 border rounded-md text-gray-700 hover:bg-gray-100">Cancel</button>
            <button type="submit" class="gradient-bg text-white px-6 py-2 rounded-md hover:opacity-90 flex items-center">
              <i data-feather="save" class="mr-2"></i> Save User
            </button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="gradient-bg text-white py-6 mt-12">
    <div class="container mx-auto px-4 text-center">
      <p>© 2025 ProfilePilot Pro. All rights reserved.</p>
    </div>
  </footer>

  <!-- Script -->
  <script>
    feather.replace();

    const addUserSection = document.getElementById('addUserSection');
    const toggleAddUserBtn = document.getElementById('toggleAddUserBtn');
    const cancelAddUserBtn = document.getElementById('cancelAddUser');

    toggleAddUserBtn.addEventListener('click', () => {
      addUserSection.classList.toggle('hidden');
      if (!addUserSection.classList.contains('hidden')) {
        window.scrollTo({ top: addUserSection.offsetTop - 20, behavior: 'smooth' });
      }
    });

    cancelAddUserBtn.addEventListener('click', () => {
      addUserSection.classList.add('hidden');
      document.getElementById('userForm').reset();
      document.getElementById('avatarPreview').src = 'https://via.placeholder.com/100';
    });

    document.getElementById('avatar').addEventListener('change', function (e) {
      if (e.target.files && e.target.files[0]) {
        const reader = new FileReader();
        reader.onload = function (event) {
          document.getElementById('avatarPreview').src = event.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    async function loadUsers() {
      const container = document.getElementById('user-container');
      container.innerHTML = '';
      try {
        const res = await fetch('http://localhost:3000/api/users');
        const users = await res.json();

        if (!users.length) {
          container.innerHTML = '<p class="text-gray-500 col-span-full text-center">No users found.</p>';
          return;
        }

        users.forEach(user => {
          const card = document.createElement('div');
          card.className = 'profile-card bg-white rounded-xl shadow-md overflow-hidden transition duration-300';
          card.innerHTML = `
            <div class="gradient-bg p-6 text-white flex items-center">
              <img src="${user.avatar || 'https://via.placeholder.com/100'}" class="w-16 h-16 rounded-full border-4 border-white object-cover">
              <div class="ml-4">
                <h3 class="font-bold text-xl">${user.name}</h3>
                <p class="text-indigo-100">${user.role || 'N/A'}</p>
              </div>
            </div>
            <div class="p-6">
              <div class="flex items-center text-gray-600 mb-2">
                <i data-feather="mail" class="w-5 h-5 mr-2"></i>
                <span>${user.email}</span>
              </div>
              <div class="flex items-center text-gray-600 mb-2">
                <i data-feather="phone" class="w-5 h-5 mr-2"></i>
                <span>${user.phone || 'N/A'}</span>
              </div>
              <div class="flex justify-end">
                <button onclick="deleteUser('${user._id}')" class="text-red-600 hover:text-red-800 flex items-center">
                  <i data-feather="trash-2" class="w-4 h-4 mr-1"></i> Delete
                </button>
              </div>
            </div>
          `;
          container.appendChild(card);
        });

        feather.replace();
      } catch (err) {
        container.innerHTML = `<p class="text-red-500 text-center">Failed to load users: ${err.message}</p>`;
      }
    }

    async function deleteUser(userId) {
      if (!confirm('Are you sure you want to delete this user?')) return;
      try {
        const res = await fetch(`http://localhost:3000/api/users/${userId}`, {
          method: 'DELETE'
        });
        if (res.ok) loadUsers();
        else alert('Failed to delete user.');
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    document.getElementById('userForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const user = {
        name: document.getElementById('firstName').value.trim() + ' ' + document.getElementById('lastName').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        role: document.getElementById('role').value,
        city: document.getElementById('city').value.trim(),
        state: document.getElementById('state').value.trim(),
        avatar: document.getElementById('avatarPreview').src
      };

      try {
        const res = await fetch('http://localhost:3000/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(user)
        });

        if (res.ok) {
          alert('User added successfully!');
          document.getElementById('userForm').reset();
          document.getElementById('avatarPreview').src = 'https://via.placeholder.com/100';
          addUserSection.classList.add('hidden');
          loadUsers();
        } else {
          const errorData = await res.json();
          alert('Failed to add user: ' + (errorData.message || res.statusText));
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });

    loadUsers();
  </script>
  hello everyone
  
</body>
</html>

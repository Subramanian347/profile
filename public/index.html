<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProfilePilot Pro | Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .profile-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
    }
  </style>
</head>
<body class="bg-gray-50">
  hello

  <!-- Navbar -->
  <nav class="gradient-bg text-white shadow-lg">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <i data-feather="user" class="w-6 h-6"></i>
        <span class="text-xl font-bold">ProfilePilot Pro</span>
      </div>
      <a href="add-user.html" class="bg-white text-indigo-700 px-4 py-2 rounded-md hover:bg-gray-100">
        Manage Users
      </a>
    </div>
  </nav>

  <!-- Main -->
  <main class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">User Profiles</h1>
    <div id="user-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- User cards injected here -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="gradient-bg text-white py-6 mt-12">
    <div class="container mx-auto px-4 text-center">
      <p>© 2025 ProfilePilot Pro. All rights reserved.</p>
    </div>
  </footer>

  <!-- Script -->
  <script>
    feather.replace();

    async function loadUsers() {
      const container = document.getElementById('user-container');
      container.innerHTML = '';

      try {
        const res = await fetch('http://localhost:3000/api/users');
        const users = await res.json();

        if (!users.length) {
          container.innerHTML = '<p class="text-gray-500 col-span-full text-center">No users found.</p>';
          return;
        }

        users.forEach(user => {
          const card = document.createElement('div');
          card.className = 'profile-card bg-white rounded-xl shadow-md overflow-hidden transition duration-300';
          card.innerHTML = `
            <div class="gradient-bg p-6 text-white flex items-center">
              <img src="${user.avatar || 'https://via.placeholder.com/100'}" class="w-16 h-16 rounded-full border-4 border-white object-cover">
              <div class="ml-4">
                <h3 class="font-bold text-xl">${user.name}</h3>
                <p class="text-indigo-100">${user.role || 'N/A'}</p>
              </div>
            </div>
            <div class="p-6">
              <div class="flex items-center text-gray-600 mb-2">
                <i data-feather="mail" class="w-5 h-5 mr-2"></i>
                <span>${user.email}</span>
              </div>
              <div class="flex items-center text-gray-600 mb-2">
                <i data-feather="phone" class="w-5 h-5 mr-2"></i>
                <span>${user.phone || 'N/A'}</span>
              </div>
              <div class="flex justify-end">
                <button onclick="deleteUser('${user._id}')" class="text-red-600 hover:text-red-800 flex items-center">
                  <i data-feather="trash-2" class="w-4 h-4 mr-1"></i> Delete
                </button>
              </div>
            </div>
          `;
          container.appendChild(card);
        });

        feather.replace();
      } catch (err) {
        container.innerHTML = `<p class="text-red-500 text-center">Failed to load users: ${err.message}</p>`;
      }
    }

    async function deleteUser(userId) {
      if (!confirm('Are you sure you want to delete this user?')) return;
      try {
        const res = await fetch(`http://localhost:3000/api/users/${userId}`, {
          method: 'DELETE'
        });
        if (res.ok) loadUsers();
        else alert('Failed to delete user.');
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    loadUsers();
  </script>
  hello everybody
</body>
</html>
